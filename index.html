<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal & Noise: POV Gimkit Quest (Florida B.E.S.T.)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0717;
            --card-bg: rgba(22, 16, 42, 0.9);
            --gim-purple: #7a22ff;
            --gim-pink: #ff007f;
            --gim-cyan: #00f0ff;
            --gim-yellow: #ffe600;
            --gim-green: #00ff66;
            --text-light: #ffffff;
            --text-subtle: #a097c0;
            --font-main: 'Outfit', sans-serif;
            --font-fun: 'Fredoka', cursive;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Top Gimkit HUD */
        header.hud-header {
            background: rgba(26, 18, 50, 0.95);
            border: 3px solid var(--gim-purple);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 30px rgba(122, 34, 255, 0.35);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 2.4rem;
            animation: bounce 2s infinite ease-in-out;
        }

        .brand-text h1 {
            font-family: var(--font-fun);
            font-size: 1.8rem;
            background: linear-gradient(45deg, var(--gim-pink), var(--gim-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

            font-size
